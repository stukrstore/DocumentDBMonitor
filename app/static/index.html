<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocDB Monitor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><h1>DocDB Monitor</h1></div>
  <span class="chip" id="who"></span>
</header>

<main>
  <section class="stats">
    <div class="stat"><span class="stat-label">전체</span><b id="stTotal">0</b></div>
    <div class="stat ok"><span class="stat-label">정상 (UP)</span><b id="stUp">0</b></div>
    <div class="stat bad"><span class="stat-label">장애 (DOWN)</span><b id="stDown">0</b></div>
    <div class="stat mute"><span class="stat-label">비활성</span><b id="stOff">0</b></div>
  </section>

  <div class="bar">
    <div>
      <h2>연결</h2>
      <p class="hint">변경 사항은 약 30초 내 수집에 반영됩니다. 주기가 짧을수록 샘플 수(비용)가 늘어납니다. 최대 5m.</p>
    </div>
    <button class="btn primary" id="btnNew">+ 연결 추가</button>
  </div>

  <section id="cards" class="cards"></section>
  <div id="empty" class="empty hidden">
    <p>등록된 연결이 없습니다.</p>
    <button class="btn primary" id="btnNew2">+ 첫 연결 추가</button>
  </div>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<dialog id="addDlg" class="dlg">
  <form id="add" autocomplete="off">
    <div class="dlg-head"><h3>연결 추가</h3><button type="button" class="x" id="addClose" aria-label="닫기">&times;</button></div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="pick">구독에서 선택</button>
      <button type="button" class="tab" data-tab="manual">직접 입력</button>
    </div>

    <div class="pane" id="pane-pick">
      <label>클러스터
        <select id="discCluster" disabled></select>
      </label>
      <label>연결 문자열 종류
        <select id="discCs" disabled></select>
      </label>
      <div class="row2">
        <label>사용자<input id="discUser" placeholder="dbadmin" autocomplete="off"></label>
        <label>비밀번호<input id="discPw" type="password" autocomplete="new-password"></label>
      </div>
      <p class="hint" id="discHint">클러스터 목록을 불러오는 중...</p>
    </div>

    <div class="pane hidden" id="pane-manual">
      <label>연결 문자열
        <input name="uri" type="password" placeholder="mongodb+srv://user:pass@host/?tls=true" autocomplete="off">
      </label>
    </div>

    <div class="row2">
      <label>이름 (a-z0-9-)<input name="name" required maxlength="40" pattern="[a-z0-9\-]+"></label>
      <label>수집 주기<select name="interval" id="addInterval"></select></label>
    </div>
    <label>메모<input name="note" maxlength="200"></label>
    <div class="switches">
      <label class="sw"><input type="checkbox" name="enabled" checked><span>사용</span></label>
      <label class="sw"><input type="checkbox" name="collstats" checked><span>CollStats 수집</span></label>
    </div>

    <p class="result hidden" id="addResult"></p>
    <div class="dlg-foot">
      <button type="button" class="btn" id="btnTest">연결 테스트</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="addCancel">취소</button>
      <button type="submit" class="btn primary">추가</button>
    </div>
  </form>
</dialog>

<dialog id="dlg" class="dlg small">
  <form method="dialog" id="uriForm" autocomplete="off">
    <div class="dlg-head"><h3>연결 문자열 변경</h3></div>
    <p class="hint"><b id="dlgName"></b> 의 연결 문자열을 교체합니다. (저장 후에는 조회할 수 없음)</p>
    <label>새 연결 문자열<input type="password" id="dlgUri" autocomplete="off" required></label>
    <div class="dlg-foot">
      <span class="grow"></span>
      <button value="cancel" type="button" class="btn" id="dlgCancel">취소</button>
      <button type="submit" value="ok" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
